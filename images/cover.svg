<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0c1426"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a4c"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="halo" cx=".72" cy=".28" r=".55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx=".2" cy=".85" r=".5">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#halo2)"/>

  <!-- 透视网格地面 -->
  <g stroke="#1e2a44" stroke-width="1" opacity=".55">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="830" x2="1600" y2="830"/>
    <line x1="200" y1="900" x2="700" y2="640"/>
    <line x1="600" y1="900" x2="900" y2="640"/>
    <line x1="1000" y1="900" x2="1100" y2="640"/>
    <line x1="1400" y1="900" x2="1300" y2="640"/>
  </g>

  <!-- 远景楼群 -->
  <g fill="url(#bldA)" stroke="#24365c" stroke-width="1.2">
    <rect x="640" y="430" width="120" height="280"/>
    <rect x="790" y="360" width="140" height="350"/>
    <rect x="1180" y="400" width="130" height="310"/>
    <rect x="1340" y="330" width="150" height="380"/>
  </g>
  <!-- 近景主楼 -->
  <g fill="url(#bldB)" stroke="#2a3d63" stroke-width="1.4">
    <rect x="960" y="250" width="180" height="460"/>
    <rect x="990" y="215" width="120" height="35" rx="4"/>
  </g>
  <!-- 天线 -->
  <line x1="1050" y1="215" x2="1050" y2="150" stroke="#2a3d63" stroke-width="2"/>
  <circle cx="1050" cy="146" r="4" fill="#38bdf8" filter="url(#glow)"/>

  <!-- 窗格：远景 -->
  <g fill="#38bdf8" opacity=".28">
    <rect x="660" y="455" width="18" height="18"/><rect x="700" y="455" width="18" height="18"/>
    <rect x="660" y="500" width="18" height="18"/><rect x="700" y="545" width="18" height="18"/>
    <rect x="815" y="390" width="20" height="20"/><rect x="865" y="390" width="20" height="20"/>
    <rect x="815" y="440" width="20" height="20"/><rect x="865" y="490" width="20" height="20"/>
    <rect x="815" y="540" width="20" height="20"/>
    <rect x="1205" y="430" width="18" height="18"/><rect x="1250" y="430" width="18" height="18"/>
    <rect x="1205" y="480" width="18" height="18"/><rect x="1250" y="530" width="18" height="18"/>
    <rect x="1370" y="360" width="20" height="20"/><rect x="1420" y="360" width="20" height="20"/>
    <rect x="1370" y="415" width="20" height="20"/><rect x="1420" y="470" width="20" height="20"/>
    <rect x="1370" y="525" width="20" height="20"/><rect x="1470" y="415" width="20" height="20"/>
  </g>
  <!-- 窗格：主楼（部分高亮告警色） -->
  <g fill="#38bdf8" opacity=".5">
    <rect x="985" y="280" width="24" height="24"/><rect x="1030" y="280" width="24" height="24"/><rect x="1075" y="280" width="24" height="24"/>
    <rect x="985" y="330" width="24" height="24"/><rect x="1075" y="330" width="24" height="24"/>
    <rect x="1030" y="380" width="24" height="24"/><rect x="1075" y="380" width="24" height="24"/>
    <rect x="985" y="430" width="24" height="24"/><rect x="1030" y="430" width="24" height="24"/>
    <rect x="1075" y="480" width="24" height="24"/><rect x="985" y="530" width="24" height="24"/>
    <rect x="1030" y="580" width="24" height="24"/><rect x="1075" y="580" width="24" height="24"/>
  </g>
  <g fill="#2dd4bf" opacity=".55">
    <rect x="1030" y="330" width="24" height="24"/><rect x="985" y="380" width="24" height="24"/>
    <rect x="1075" y="430" width="24" height="24"/><rect x="985" y="580" width="24" height="24"/>
  </g>
  <rect x="1030" y="480" width="24" height="24" fill="#f59e0b" opacity=".8" filter="url(#glow)"/>
  <rect x="1075" y="530" width="24" height="24" fill="#fb7185" opacity=".7" filter="url(#glow)"/>

  <!-- 数据流曲线 -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M120 620 C 420 480, 620 680, 900 520 S 1350 300, 1560 420" stroke="url(#flow1)" stroke-width="2.6"/>
    <path d="M60 700 C 380 600, 700 760, 1000 620 S 1400 460, 1580 560" stroke="url(#flow2)" stroke-width="2" opacity=".8"/>
    <path d="M300 560 C 550 420, 800 560, 1050 430" stroke="url(#flow1)" stroke-width="1.6" opacity=".55"/>
  </g>
  <!-- 数据节点 -->
  <g filter="url(#glow)">
    <circle cx="330" cy="568" r="5" fill="#38bdf8"/>
    <circle cx="620" cy="606" r="4" fill="#2dd4bf"/>
    <circle cx="900" cy="520" r="5.5" fill="#38bdf8"/>
    <circle cx="1150" cy="418" r="4" fill="#818cf8"/>
    <circle cx="1420" cy="380" r="5" fill="#818cf8"/>
    <circle cx="480" cy="672" r="4" fill="#2dd4bf"/>
    <circle cx="1010" cy="618" r="4.5" fill="#38bdf8"/>
  </g>
  <!-- 环绕主楼的扫描环 -->
  <ellipse cx="1050" cy="470" rx="230" ry="64" fill="none" stroke="#38bdf8" stroke-width="1.4" opacity=".5" stroke-dasharray="10 8"/>
  <ellipse cx="1050" cy="470" rx="300" ry="92" fill="none" stroke="#818cf8" stroke-width="1" opacity=".3" stroke-dasharray="4 10"/>

  <!-- 漂浮粒子 -->
  <g fill="#38bdf8" opacity=".5">
    <circle cx="180" cy="200" r="2"/><circle cx="420" cy="140" r="2.5"/><circle cx="700" cy="220" r="2"/>
    <circle cx="1240" cy="150" r="2.5"/><circle cx="1480" cy="240" r="2"/><circle cx="260" cy="420" r="2"/>
  </g>
</svg>
